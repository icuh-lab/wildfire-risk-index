name: wildfire-risk-index CI/CD Pipeline to using Docker Hub

# 워크플로우가 실행될 조건 (트리거)
on:
  push:
    branches: [ "main" ] # main 브랜치에 push 될 때 실행
  pull_request:          # PR에서는 test 잡만 돈다(아래 if로 빌드·배포를 막는다)

# 실행될 작업(Job)들 정의
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 수집 커버리지 가드가 살아 있는지 확인한다.
      # 이 테스트가 깨진 채 배포되면 시도 단위 누락이 다시 조용히 지나간다.
      - name: Run tests
        run: python -m pytest tests/ -v

  build-and-push:
    needs: test
    # PR에서는 이미지를 밀지 않는다. main에 들어온 뒤에만 빌드·배포한다.
    if: github.event_name == 'push'
    # 작업이 실행될 가상 환경
    runs-on: ubuntu-latest

    # 배포 잡이 "방금 민 이미지가 맞는지" 대조할 수 있게 digest를 넘긴다.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    # 작업의 단계(Step)들
    steps:
      # 1. 레포지토리 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # 2단계에서 GitHub Secrets에 저장한 정보 사용
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Docker 이미지 빌드 및 Docker Hub에 푸시
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 이미지 태그 설정: DockerHubID/레포지토리이름:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest

 # ===== 여기부터 배포 작업 추가 =====
  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest image on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ec2-54-180-165-127.ap-northeast-2.compute.amazonaws.com
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # 어느 호스트에 붙었는지 로그에 남긴다. 배포 대상이 어긋나면 여기서 바로 보인다.
            echo "배포 대상 호스트: $(hostname -f)"

            # Docker Hub에서 최신 이미지를 pull 받아 놓기만 한다.
            # 실행은 EC2의 Cron이 담당한다.
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
            sudo docker pull "$IMAGE"

            # 방금 민 digest와 대조한다.
            # pull이 성공해도 크론이 도는 호스트가 아니면 옛 이미지가 그대로 남는데,
            # 2026-08-28에 실제로 그렇게 배포가 성공 표시된 채 반영되지 않았다.
            EXPECTED="${{ needs.build-and-push.outputs.digest }}"
            PULLED=$(sudo docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE")
            echo "기대 digest: $EXPECTED"
            echo "실제 digest: $PULLED"
            case "$PULLED" in
              *"$EXPECTED"*) echo "이미지 반영 확인" ;;
              *) echo "!! 이 호스트의 이미지가 방금 민 것과 다르다. 배포 대상 호스트를 확인해야 한다."; exit 1 ;;
            esac
            
            # 2. GitHub Secrets의 값을 사용하여 EC2 서버에 .env 파일을 생성합니다.
            tee /home/ubuntu/.env <<EOF
            # 이 파일은 GitHub Actions에 의해 자동 생성됩니다.
            EXECUTION_ENV=production
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            EOF
